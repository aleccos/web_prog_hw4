<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Weather Dashboard</h1>

      <form id="search-form" class="search-form">
        <label for="city-input" class="visually-hidden">City name</label>
        <input
          type="text"
          id="city-input"
          placeholder="Enter a city, e.g. Beirut"
          maxlength="60"
          autocomplete="off"
        />
        <button type="submit" id="search-button">Search</button>
      </form>

      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
        <p>Loading weather...</p>
      </div>

      <p id="error" class="error" role="alert" hidden></p>

      <section id="weather" class="weather" hidden>
        <h2 id="city-name"></h2>

        <div class="main-info">
          <img id="weather-icon" src="" alt="" width="100" height="100" />
          <div>
            <p id="temperature" class="temperature"></p>
            <p id="description" class="description"></p>
          </div>
        </div>

        <ul class="details">
          <li>
            <span class="label">Feels like</span>
            <span id="feels-like" class="value"></span>
          </li>
          <li>
            <span class="label">Humidity</span>
            <span id="humidity" class="value"></span>
          </li>
          <li>
            <span class="label">Wind speed</span>
            <span id="wind" class="value"></span>
          </li>
          <li>
            <span class="label">Pressure</span>
            <span id="pressure" class="value"></span>
          </li>
        </ul>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
